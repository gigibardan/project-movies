name: Sync FileSuN IDs

on:
  schedule:
    # Every 3 days at 4:00 AM UTC
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run sync script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          # Script reads from .env.local, so create it
          echo "TMDB_API_KEY=$TMDB_API_KEY" > .env.local
          node scripts/sync-filesun.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/filesun-ids.json public/data/imdb-tmdb-map.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-sync FileSuN IDs [$(date -u +%Y-%m-%d)]"
            git push
          fi